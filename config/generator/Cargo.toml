[package]
name = "wto"
edition = "2024"
license-file = "../../LICENSE"
repository = "https://github.com/Yokaiste/WTO"
publish = false

[workspace]

[dependencies]
ymb-sdk = { path = "../../../../src/sdk" }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

