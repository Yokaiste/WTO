version: 1
id: 'wto'
name: 'WTO'
description: 'WARNO Tactical Overhaul — ranges, speeds, vision and weapon
  behavior rebalanced across the whole game'
enabled: true
priority: 20
allowWriteToModifiedFiles: true
variables:
  modTag: 'WTO'
  # Category scales compose with each feature's multipliers.
  multipliers:
    range: 1.0
    speed: 1.0
    vision: 1.0
    supply: 1.0
    timing: 1.0
    dispersion: 1.0
    suppression: 1.0
    ammunition: 1.0
  tuning:
    missileFlightMultiplier: 1.0
    ammunitionRangeMultiplier: 1.0
    missileRangeMultiplier: 1.0
    projectileSpeedMultiplier: 1.0
    howitzerSpreadMultiplier: 1.0
    suppressionMultiplier: 1.0
    aaLockTimeMultiplier: 1.0
    aaCycleTimeMultiplier: 1.0
    gau8BurstMultiplier: 1.0
    bmp2:
      salvoMultiplier: 1.0
      accuracyMultiplier: 1.0
      # Shot/display counts must agree in both ammunition profiles and compatibility.
      salvoSize: ${round(8 * multipliers.ammunition * tuning.bmp2.salvoMultiplier)}
