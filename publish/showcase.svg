<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">WTO: rethink the approach</title>
  <desc id="desc">WARNO Tactical Overhaul. A tactical map shows an armored unit flanking an enemy position and its engagement range. WTO changes weapon ranges, movement, and firing cycles.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#202b26"/>
      <stop offset="1" stop-color="#0b1416"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#71855c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#71855c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sector" x1=".8" x2=".2" y2="1">
      <stop stop-color="#df8c58" stop-opacity=".17"/>
      <stop offset="1" stop-color="#df8c58" stop-opacity=".01"/>
    </linearGradient>
    <linearGradient id="armor" x2="1" y2="1">
      <stop stop-color="#72856a"/>
      <stop offset="1" stop-color="#293c35"/>
    </linearGradient>
    <linearGradient id="edge">
      <stop stop-color="#d8dfab" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d8dfab"/>
      <stop offset="1" stop-color="#d8dfab" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
